<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكنولوجيات سبأ - Saba AI 3D Avatar</title>
    <!-- مكتبة لتصميم الأيقونات والخطوط -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col justify-between">

    <!-- رأس الصفحة -->
    <header class="bg-gray-800 p-4 shadow-md flex justify-between items-center border-b border-gray-700">
        <h1 class="text-xl font-bold text-blue-400">🤖 Saba AI - المساعد الذكي الثوري</h1>
        <div class="text-sm text-gray-400">التخزين المحلي مفعل 🟢</div>
    </header>

    <!-- منطقة العرض الرئيسية (الروبوت 3D والدردشة) -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- قسم روبوت الفيديو التفاعلي 3D -->
        <div class="w-1/2 bg-gray-950 flex flex-col items-center justify-center p-6 border-l border-gray-800 relative">
            <div id="avatar-container" class="w-64 h-64 bg-blue-900/20 rounded-full flex items-center justify-center border-4 border-blue-500/50 shadow-2xl relative animate-pulse">
                <!-- تمثيل مرئي مبدئي للروبوت التفاعلي -->
                <div class="absolute inset-0 flex items-center justify-center text-6xl">🤖</div>
            </div>
            <p id="robot-status" class="mt-6 text-gray-300 font-semibold">في انتظار الأوامر...</p>
        </div>

        <!-- قسم الدردشة والتفاعل النصي والصوتي -->
        <div class="w-1/2 flex flex-col bg-gray-900 p-4">
            <!-- صندوق المحادثة -->
            <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 p-2 mb-4 bg-gray-950/50 rounded-xl border border-gray-800">
                <div class="bg-blue-600/20 p-3 rounded-lg max-w-[80%] border border-blue-500/30">
                    <p class="text-sm">أهلاً بك! أنا مساعد سبأ الذكي. يمكنك التحدث معي نصياً أو صوتياً، وسأقوم بمساعدتك بكل ذكاء.</p>
                </div>
            </div>

            <!-- أزرار التحكم والادخال -->
            <div class="flex items-center gap-2 bg-gray-800 p-2 rounded-xl border border-gray-700">
                <button id="mic-btn" onclick="toggleSpeechRecognition()" class="bg-gray-700 hover:bg-gray-600 p-3 rounded-lg text-xl transition" title="تحدث بالصوت">
                    🎙️
                </button>
                <input type="text" id="user-input" placeholder="اكتب رسالتك هنا..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 text-white">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-lg font-bold transition">
                    إرسال 🚀
                </button>
            </div>
        </div>

    </div>

    <!-- جافاسكريبت للتفاعل والربط -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('userInput');
        const robotStatus = document.getElementById('robot-status');

        // تحميل المحادثات المحفوظة من جهاز المستخدم (Local Storage)
        window.onload = () => {
            const savedChat = localStorage.getItem('saba_chat_history');
            if (savedChat) {
                chatBox.innerHTML = savedChat;
            }
        };

        function saveChatHistory() {
            localStorage.setItem('saba_chat_history', chatBox.innerHTML);
        }

        // إرسال الرسالة للخلفية
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // إضافة رسالة المستخدم للدردشة
            appendMessage(text, 'user');
            userInput.value = '';
            robotStatus.innerText = 'جاري التفكير والمعالجة... 🤔';

            try {
                const response = await fetch('http://localhost:5000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                if (data.reply) {
                    appendMessage(data.reply, 'ai');
                    speakText(data.reply); // نطق الرد صوتاً
                    robotStatus.innerText = 'جاهز للتفاعل ✨';
                } else {
                    appendMessage('حدث خطأ في الاتصال بالذكاء الاصطناعي.', 'ai');
                    robotStatus.innerText = 'خطأ في الاتصال ⚠️';
                }
            } catch (error) {
                console.error(error);
                appendMessage('تعذر الاتصال بالخادم.', 'ai');
                robotStatus.innerText = 'غير متصل ❌';
            }
            saveChatHistory();
        }

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.className = sender === 'user' 
                ? 'bg-blue-600/30 p-3 rounded-lg max-w-[80%] ml-auto border border-blue-500/30 text-right' 
                : 'bg-gray-800 p-3 rounded-lg max-w-[80%] mr-auto border border-gray-700 text-right';
            div.innerHTML = `<p class="text-sm">${text}</p>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // تحويل النص إلى صوت (Speech Synthesis)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                window.speechSynthesis.speak(utterance);
            }
        }

        // تحويل الصوت إلى نص (Speech to Text)
        function toggleSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('متصفحك لا يدعم التحويل الصوتي.');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            
            robotStatus.innerText = 'جاري الاستماع... 🎤';
            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                userInput.value = speechToText;
                robotStatus.innerText = 'تم التعرف على الصوت بنجاح ✅';
                sendMessage();
            };
            recognition.start();
        }
    </script>
</body>
</html>
